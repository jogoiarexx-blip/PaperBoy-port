name: Publicar PAPERROUTE no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paperroute-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Obter os arquivos
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Python para Blender
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar gerador 3D
        run: python -m pip install --disable-pip-version-check "bpy==4.2.0" "numpy<2" "Pillow>=10,<12"
      - name: Gerar assets originais a partir do fonte
        run: |
          python art/run_bpy.py
          python art/run_living_world.py
          python art/run_detail_world.py
      - name: Preparar céu e conferir assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          output = Path('public/textures/summer-sky-v5.webp')
          output.parent.mkdir(parents=True, exist_ok=True)
          Image.open('art/textures/summer-sky-v5-source.png').convert('RGB').save(output, 'WEBP', quality=85)
          assets = json.loads(Path('public/assets/manifest.json').read_text())['assets']
          assert len(assets) == 42, f"Esperados 42 GLBs, obtidos {len(assets)}"
          for asset in assets:
              assert (Path('public/assets') / asset['file']).is_file(), asset['id']
          print(f"PUBLICAÇÃO: {len(assets)} modelos disponíveis")
          PY
      - name: Gerar trilha sonora
        run: python scripts/pages-generate-audio.py
      - name: Instalar frontend estático
        run: |
          npm --prefix pages-site install --no-audit --no-fund
          ln -s pages-site/node_modules node_modules
      - name: Compilar site
        run: npm --prefix pages-site run build
      - name: Validar saída
        run: |
          test -s pages-site/dist/index.html
          test -s pages-site/dist/assets/manifest.json
          test -s pages-site/dist/textures/summer-sky-v5.webp
          find pages-site/dist -maxdepth 2 -type f | head -30
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
